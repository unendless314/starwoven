# 星靈織語 Starwoven — Nginx 伺服器配置 (vhost / server block)
# 檔案位置: /etc/nginx/sites-available/starwoven（軟連結至 /etc/nginx/sites-enabled/starwoven）
#
# 本檔為 VPS 部署版之唯一正本（DEC-073、DEC-079，規格 demo_docs/ai_platform_plan.md 第八節第 2 小節）：
# 以 repo 版為底，合併部署版之 80→301、443／certbot 憑證、location / 首頁 fallback 與靜態資產長快取，
# 並新增 AI 互動功能 API 反向代理（每個功能一個 location）。整份替換前務必備份現行 vhost 並以 diff 核對 443／憑證段落。
# 本檔經 sites-enabled 被 include 於 nginx.conf 的 http {} 內。

# =========================================================
# AI 互動功能 API 依 IP 限流（http context，必須位於 server {} 之外）
# 每個功能一個 zone，命名 <feature>_api（各功能分開計算）
# ⚠️ zone 名稱不得為 `api`（已被同主機 exopolitics 佔用，重名會使 nginx -t 失敗）
# =========================================================
limit_req_zone $binary_remote_addr zone=tarot_api:1m rate=3r/m;

# =========================================================
# HTTP → HTTPS 轉址（IPv4／IPv6 雙 stack）
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name starwoven.xyz www.starwoven.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starwoven.xyz www.starwoven.xyz;

    # certbot 管理之憑證（續期採 webroot：/var/www/starwoven/.well-known/acme-challenge/）
    ssl_certificate /etc/letsencrypt/live/starwoven.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starwoven.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 站台根目錄：內容為 build 產物 dist/client/（由 scripts/deploy.sh 同步）
    root /var/www/starwoven;
    index index.html;

    # 字元編碼
    charset utf-8;

    # =========================================================
    # 舊路由永久重定向 (HTTP 301 Moved Permanently)
    # 精確匹配帶斜線與不帶斜線，完整轉移 SEO 權重至專欄專文
    # =========================================================
    location = /reiki {
        return 301 /blog/reiki-and-chakras;
    }
    location = /reiki/ {
        return 301 /blog/reiki-and-chakras;
    }

    location = /akashic {
        return 301 /blog/light-and-akashic-records;
    }
    location = /akashic/ {
        return 301 /blog/light-and-akashic-records;
    }

    # =========================================================
    # Gzip 內容壓縮傳輸優化
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # =========================================================
    # 靜態資源快取 (CSS, JS, 圖片, 字體)
    # ⚠️ public/assets/ 檔名不含 hash：換圖必須升版號（_v2、_v3），不得同名覆蓋（known_issues 第 6 項）
    # location 內出現 add_header 即不再繼承 server 層標頭，故於此重列安全標頭
    # =========================================================
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # =========================================================
    # 靜態多頁面路由（錯誤網址以首頁 fallback，沿用線上行為；404 頁見 known_issues 第 6 項）
    # =========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # AI 互動功能 API → Astro Node 服務（systemd starwoven-app，只監聽 127.0.0.1:4321）
    # 每個功能一個 location（內容除 zone 外相同）；未登錄之 /api/* 不轉送 Node。
    # 新增功能時同步 scripts/deploy.sh 之 SMOKE_PATHS（ai_platform_plan.md 第十節）。
    # ⚠️ 不得開啟 proxy_intercept_errors：端點自身的 DAILY_LIMIT（429）、AI_FAILED（502）、
    #    DISABLED／AI_BUSY（503）須原樣穿透；error_page 僅作用於 nginx 自身產生的錯誤。
    # ⚠️ AI location 與 named location 不得新增 add_header（否則 server 層安全標頭不再繼承）。
    # =========================================================

    # 線上塔羅抽卡
    location /api/tarot/ {
        limit_req zone=tarot_api burst=2 nodelay;
        limit_req_status 429;

        # ↔ src/lib/ai/shared/config.ts REQUEST_BODY_MAX_BYTES（2048）須一致
        client_max_body_size 2k;
        # ↔ 須大於 src/lib/ai/shared/config.ts CLIENT_REQUEST_TIMEOUT_MS（30s）＞ SERVER_AI_TIMEOUT_MS（25s）
        proxy_read_timeout 35s;

        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # nginx 層錯誤回傳 JSON（錯誤碼對照 demo_docs/ai_platform_plan.md 第四節第 2、3 小節）
        error_page 429 = @ai_429;
        error_page 413 = @ai_413;
        error_page 502 = @ai_502;
        error_page 504 = @ai_504;
    }

    # nginx 層 JSON 錯誤頁：全部 AI 功能共用
    location @ai_429 {
        default_type application/json;
        return 429 '{"ok":false,"error":"RATE_LIMITED"}';
    }
    location @ai_413 {
        default_type application/json;
        return 413 '{"ok":false,"error":"PAYLOAD_TOO_LARGE"}';
    }
    location @ai_502 {
        default_type application/json;
        return 502 '{"ok":false,"error":"SERVICE_DOWN"}';
    }
    location @ai_504 {
        default_type application/json;
        return 504 '{"ok":false,"error":"GATEWAY_TIMEOUT"}';
    }

    # 安全標頭防護
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
