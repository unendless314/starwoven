# 星靈織語 Starwoven — Nginx 伺服器配置 (vhost / server block)
# 檔案位置建議放置於: /etc/nginx/sites-available/starwoven
# 並軟連結至: /etc/nginx/sites-enabled/starwoven

server {
    listen 80;
    listen [::]:80;
    server_name starwoven.xyz www.starwoven.xyz;

    # 站台根目錄 (依據 spec.md 部署規範)
    root /var/www/starwoven;
    index index.html;

    # 字元編碼
    charset utf-8;

    # =========================================================
    # 舊路由永久重定向 (HTTP 301 Moved Permanently)
    # 精確匹配帶斜線與不帶斜線，完整轉移 SEO 權重至專欄專文
    # =========================================================
    location = /reiki {
        return 301 /blog/reiki-and-chakras;
    }
    location = /reiki/ {
        return 301 /blog/reiki-and-chakras;
    }

    location = /akashic {
        return 301 /blog/light-and-akashic-records;
    }
    location = /akashic/ {
        return 301 /blog/light-and-akashic-records;
    }

    # =========================================================
    # Gzip 內容壓縮傳輸優化
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # =========================================================
    # 靜態資源快取優化 (CSS, JS, 圖片, 字體)
    # =========================================================
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # =========================================================
    # 靜態多頁面路由 (HTML 靜態檔案優先)
    # =========================================================
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 安全標頭防護
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
